build:
  name: Create Google Services files
  steps:
    - eas/checkout
    - run:
        name: Create google services
        command: echo $GOOGLE_SERVICES_JSON | base64 -d > google-services.json
    - run:
        name: Create google service plist
        command: echo $GOOGLE_SERVICE_INFO_PLIST | base64 -d > GoogleService-Info.plist
