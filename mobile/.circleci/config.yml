version: 2.1
parameters:
  working_dir:
    type: string
    default: "/tmp/project"
  build_path:
    type: string
    default: "node_modules"
  docker_base_image_version:
    type: string
    default: "node:20.19.1"

executors:
  build:
    working_directory: << pipeline.parameters.working_dir >>
    docker:
      - image: << pipeline.parameters.docker_base_image_version >>
    resource_class: "small"

orbs:
  aws-cli: circleci/aws-cli@5.1.1

commands:
  expo_install_with_cache:
    description: Install dependencies and save cache
    steps:
      - restore_cache:
          name: Restore existing cache
          key: v1-expo-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: |
            npm ci --cache node_modules --prefer-offline --no-audit
            npm install -g eas-cli --prefer-offline --no-audit
      - save_cache:
          name: Save  cache
          key: v1-expo-{{ checksum "package-lock.json" }}
          paths:
            - << pipeline.parameters.build_path >>
  expo_restore_cache:
    description: Restore expo cache
    steps:
      - restore_cache:
          name: Restore expo cache
          keys:
            - v1-expo-{{ checksum "package-lock.json" }}
  add_deploy_key:
    description: Add circleci ssh key
    steps:
      - add_ssh_keys:
          fingerprints:
            - "d2:7f:c2:33:48:9f:84:c4:3a:8e:52:09:e9:5e:0e:9a"
  eas_profile_json:
    description: Create eas.json
    steps:
      - run:
          name: Create eas.json
          command: |
            cat \<<EOF >eas.json
            {
                "cli": {
                    "version": ">= 16.14.0",
                    "appVersionSource": "remote"
                },
                "build": {
                    "development": {
                        "developmentClient": true,
                        "distribution": "internal",
                        "environment": "preview"
                    },
                    "preview": {
                        "distribution": "internal",
                        "environment": "preview"
                    },
                    "production": {
                        "autoIncrement": true,
                        "environment": "production"
                    }
                },
                "submit": {
                    "production": {}
                }
            }
            EOF
  build_development_package:
    description: Build Android package for internal preview
    parameters:
      build_type:
        type: string
        default: "android"
    steps:
      - expo_restore_cache
      - eas_profile_json
      - run:
          name: Configure EAS
          command: eas whoami
      - run:
          name: Build internal package
          command: eas build --platform << parameters.build_type >> --profile preview --non-interactive --no-wait

jobs:
  build_android:
    executor: build
    steps:
      - add_deploy_key
      - checkout
      - build_development_package:
          build_type: "android"

  build_ios:
    executor: build
    steps:
      - add_deploy_key
      - checkout
      - build_development_package:
          build_type: "ios"

  build_cache:
    executor: build
    steps:
      - add_deploy_key
      - checkout
      - expo_install_with_cache


workflows:
  build-test-and-deploy:
    jobs:
      - build_cache:
          name: Build EXPO cache

      - approve-internal-android-deploy:
          name: Approve Android build
          type: approval
          requires:
            - Build EXPO cache
          filters:
            branches:
              ignore:
                - main

      - approve-internal-ios-deploy:
          name: Approve iOS build
          type: approval
          requires:
            - Build EXPO cache
          filters:
            branches:
              ignore:
                - main

      - build_ios:
          name: Build Internal iOS build
          requires:
            - Approve iOS build
          filters:
            branches:
              ignore:
                - main

      - build_android:
          name: Build Internal Androi build
          requires:
            - Approve Android build
          filters:
            branches:
              ignore:
                - main


