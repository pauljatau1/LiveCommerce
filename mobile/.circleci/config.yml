version: 2.1
parameters:
  working_dir:
    type: string
    default: "/tmp/project"
  build_path:
    type: string
    default: "dist"
  docker_base_image_version:
    type: string
    default: "node:20.19.1"

executors:
  build:
    working_directory: << pipeline.parameters.working_dir >>
    docker:
      - image: << pipeline.parameters.docker_base_image_version >>
    resource_class: "medium"

orbs:
  aws-cli: circleci/aws-cli@5.1.1

commands:
  login_with_web_identity:
    description: Login using AWS IAM Identity provider via CircleCI OIDC
    parameters:
      account_id:
        type: string
        default: "298884149618"
    steps:
      - run:
          name: Login web identity
          command: |
            if ! dpkg -s jq &>/dev/null; then
              if [[ $(whoami) == "root" ]]; then
                apt-get update && apt-get install jq -y
              else
                sudo apt-get update && sudo apt-get install jq -y
              fi
            fi
            AWS_STS_CREDENTIALS=$(aws sts assume-role-with-web-identity \
                  --duration-seconds 3600 \
                  --output "json" \
                  --query "Credentials" \
                  --role-arn "arn:aws:iam::<< parameters.account_id >>:role/circleci-oidc" \
                  --role-session-name "<< parameters.account_id >>-oidc-credentials" \
                  --web-identity-token "${CIRCLE_OIDC_TOKEN}")
            export AWS_ACCESS_KEY_ID=$(echo $AWS_STS_CREDENTIALS | jq .AccessKeyId | xargs)
            export AWS_SECRET_ACCESS_KEY=$(echo $AWS_STS_CREDENTIALS | jq .SecretAccessKey | xargs)
            export AWS_SESSION_TOKEN=$(echo $AWS_STS_CREDENTIALS | jq .SessionToken | xargs)

            echo "export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$BASH_ENV"
            echo "export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$BASH_ENV"
            echo "export AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> "$BASH_ENV"
            source "$BASH_ENV"
  android_install_with_cache:
    description: Install npm android dependencies
    steps:
      - restore_cache:
          name: Restore existing android cache
          key: v1-seller-{{ .Revision }}
      - run:
          name: Install dependencies
          command: |
            npm install
            eas build —platform Android
      - store_artifacts:
          path: package-lock.json
      - save_cache:
          name: Save android cache
          key: v1-android-{{ .Revision }}
          paths:
            - << pipeline.parameters.build_path >>
  android__restore_cache:
    description: Restore android cache
    steps:
      - restore_cache:
          name: Restore android cache
          keys:
            - v1-android-{{ .Revision }}

  add_deploy_key:
    description: Add circleci ssh key
    steps:
      - add_ssh_keys:
          fingerprints:
            - "d2:7f:c2:33:48:9f:84:c4:3a:8e:52:09:e9:5e:0e:9a"

jobs:
  build_android:
    executor: build
    steps:
      - add_deploy_key
      - checkout
      - android_install_with_cache

workflows:
  build-test-and-deploy:
    jobs:
      - build_android:
          name: build_android

      - approve-staging-backend-deploy:
          type: approval
          requires:
            - build_android
