version: '3'

services:
  mongodb:
    image: mongo:latest
    container_name: auqli-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - auqli-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auqli-server
    restart: unless-stopped
    ports:
      - '8000:8000'
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/auqli
      - MONGODB_CONNECTION_RETRIES=5
      - MONGODB_RETRY_INTERVAL=5000
    networks:
      - auqli-network

networks:
  auqli-network:
    driver: bridge

volumes:
  mongodb_data:
