<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <script>
    // Only initialize Clarity if consent exists
    function initClarity(userInfo) {
      if (!window.isProduction) {
        return;
      }
      const consent = localStorage.getItem('analytics-consent');
      if (consent === 'true') {
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
          t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "pe23vgdq2k");

        // If user info is provided, identify the user with the correct syntax
        if (userInfo) {
          // Per documentation: clarity("identify", "custom-id", "custom-session-id", "custom-page-id", "friendly-name")
          // Email as custom-id for cross-device tracking, full name as friendly-name
          window.clarity("identify", userInfo.email, userInfo.id, window.location.pathname, `${userInfo.firstName} ${userInfo.lastName}`);
        }
      }
    }

    // Check for,  existing consent on page load
    if (localStorage.getItem('analytics-consent') === 'true' || localStorage.getItem('analytics-consent') === 'false') {
      const seller = JSON.parse(localStorage.getItem('seller'));
      // console.log('analytics seller', seller);
      if (seller) {
        // Create userInfo object for Clarity identification
        const userInfo = {
          id: seller._id,
          email: seller.email,
          firstName: seller.firstName,
          lastName: seller.lastName
        };
        initClarity(userInfo);
      } else {
        initClarity();
      }
    }
  </script>
