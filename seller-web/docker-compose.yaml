services:
  api:
    image: node:20
    command: sh -c "cd usr/src/app && npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - VITE_APP_STATE=development
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_CDN_URL=https://cdn.staging.auqli.live
      - CHOKIDAR_USEPOLLING=true
      - RELEASE_HASH=qwerty
    volumes:
      - .:/usr/src/app
  build:
    image: node:20
    command: sh -c "cd usr/src/app && npm install && npx serve -s dist"
    ports:
      - "3000:3000"
    environment:
      - VITE_APP_STATE=development
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_CDN_URL=https://cdn.staging.auqli.live
      - CHOKIDAR_USEPOLLING=true
      - RELEASE_HASH=qwerty
    volumes:
      - .:/usr/src/app